name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright
        timeout-minutes: 5
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit Streamlit App
        timeout-minutes: 7
        run: |
          timeout --kill-after=10s 360s python -u - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          URL = "https://thainq-early-kidney-prediction.streamlit.app/"

          with sync_playwright() as p:
              print("Launching Chromium...")

              browser = p.chromium.launch(
                  headless=True,
                  timeout=30000
              )

              page = browser.new_page(
                  viewport={"width": 1920, "height": 1080}
              )

              page.set_default_timeout(10000)
              page.set_default_navigation_timeout(45000)

              def screenshot(name):
                  try:
                      page.screenshot(
                          path=name,
                          timeout=10000
                      )
                      print(f"Screenshot saved: {name}")
                  except Exception as e:
                      print(f"Screenshot error: {e}")

              try:
                  print(f"Opening: {URL}")

                  try:
                      page.goto(
                          URL,
                          wait_until="domcontentloaded",
                          timeout=45000
                      )
                  except Exception as e:
                      print(f"Navigation warning: {e}")

                  print("Current URL:", page.url)

                  screenshot("01-initial.png")

                  heading = page.get_by_role(
                      "heading",
                      name="AKI Risk Prediction",
                      exact=True
                  )

                  predict_button = page.get_by_role(
                      "button",
                      name="Predict AKI",
                      exact=True
                  )

                  wake_button = page.get_by_role(
                      "button",
                      name="Yes, get this app back up!"
                  )

                  deadline = time.monotonic() + 180
                  wake_clicked = False

                  while time.monotonic() < deadline:
                      print("Checking app:", page.url)

                      if heading.is_visible() and predict_button.is_visible():
                          print("SUCCESS: AKI app is accessible.")
                          screenshot("02-success.png")
                          break

                      if not wake_clicked and wake_button.is_visible():
                          print("Sleeping app detected.")
                          screenshot("02-sleeping.png")

                          wake_button.click(timeout=10000)
                          wake_clicked = True

                          print("Wake-up button clicked.")

                      page.wait_for_timeout(5000)

                  else:
                      raise RuntimeError(
                          "App did not become ready within 180 seconds."
                      )

              except Exception as e:
                  print("ERROR:", str(e))
                  screenshot("03-error.png")
                  raise

              finally:
                  print("Final URL:", page.url)
                  browser.close()
          PY

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: streamlit-status
          path: "*.png"
          retention-days: 3
          if-no-files-found: warn
