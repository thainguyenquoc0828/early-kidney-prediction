name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit Streamlit App
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://thainq-early-kidney-prediction.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(url, timeout=120000)
              page.wait_for_timeout(10000)

              wake_button = page.get_by_role(
                  "button", name="Yes, get this app back up!"
              )

              if wake_button.is_visible():
                  wake_button.click()
                  page.wait_for_timeout(60000)

              page.locator('[data-testid="stAppViewContainer"]').wait_for(
                  timeout=120000
              )

              print("Streamlit app loaded successfully.")
              browser.close()
          PY
